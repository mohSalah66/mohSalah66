name: Daily Metrics

on:
  # Schedule daily updates
  schedule: [{ cron: "0 0 * * *" }]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  # push: {branches: ["master", "main"]}

# Prevent overlapping runs (e.g. manual + scheduled) from racing on pushes
concurrency:
  group: daily-metrics
  cancel-in-progress: false

jobs:
  devcard:
    runs-on: ubuntu-latest
    steps:
      - name: devcard
        uses: dailydotdev/action-devcard@2.0.5
        with:
          devcard_id: ${{ secrets.DEVCARD_ID }}
          commit_filename: res/mohsalah66.devcard.svg
          commit_message: "chore: update ${filename}"

  github-metrics:
    runs-on: ubuntu-latest
    needs: devcard
    steps:
      - name: Repo Status
        uses: lowlighter/metrics@latest
        with:
          filename: res/mohsalah66.profile.overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mohsalah66
          base: header, repositories, activity, community, metadata
          plugin_lines: yes
          repositories: 1000
          committer_message: "chore: update profile overview."
          config_timezone: Africa/Khartoum

  github-habits-list:
    runs-on: ubuntu-latest
    needs: github-metrics
    timeout-minutes: 15
    steps:
      - name: Get The habits
        uses: lowlighter/metrics@latest
        with:
          filename: res/mohsalah66.habits.charts.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mohsalah66
          base: ""
          repositories: 100
          committer_message: "chore: update habits chart."
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_days: 14
          plugin_habits_trim: yes
          plugin_habits_charts: yes
          config_timezone: Africa/Khartoum

  github-language-status:
    runs-on: ubuntu-latest
    needs: github-habits-list
    steps:
      - name: Languages Status Must Used (with details)
        uses: lowlighter/metrics@latest
        with:
          filename: res/mohsalah66.languages.details.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mohsalah66
          base: ""
          repositories: 1000
          committer_message: "chore: update languages stats."
          plugin_languages: yes
          plugin_languages_categories: programming, data, prose, markup
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          config_timezone: Africa/Khartoum

  github-3d-contrib:
    runs-on: ubuntu-latest
    needs: github-language-status   # runs last, after all other commits to master
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: mohsalah66
          MAX_REPOS: 100

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "chore: update 3d contribution graph" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin master && git push && exit 0
            sleep 5
          done
          exit 1

  github-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mohsalah66
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
